name: ASTM F3411-22a
description: Verify compliance to ASTM F3411-22a requirements for a collection of Service Providers, Display Providers, and/or DSS providers.
resource_inputs:
  - resource_id: test_env_version_providers
    type: resources.versioning.VersionProvidersResource?
    description: Means by which to retrieve and record the versions of the systems under test.
  - resource_id: system_identity
    type: resources.versioning.SystemIdentityResource?
  - resource_id: flights_data
    type: resources.netrid.FlightDataResource
  - resource_id: service_providers
    type: resources.netrid.NetRIDServiceProviders?
  - resource_id: observers
    type: resources.netrid.NetRIDObserversResource?
  - resource_id: mock_uss_dp
    type: resources.interuss.mock_uss.client.MockUSSResource?
  - resource_id: mock_uss_sp
    type: resources.interuss.mock_uss.client.MockUSSResource?
  - resource_id: evaluation_configuration
    type: resources.netrid.EvaluationConfigurationResource
  - resource_id: dss_instances
    type: resources.astm.f3411.DSSInstancesResource?
  - resource_id: dss_datastore_cluster
    type: resources.interuss.datastore.DatastoreDBClusterResource?
  - resource_id: utm_client_identity
    type: resources.communications.ClientIdentityResource
  - resource_id: id_generator
    type: resources.interuss.IDGeneratorResource
  - resource_id: service_area
    type: resources.netrid.ServiceAreaResource
  - resource_id: problematically_big_area
    type: resources.VolumeResource
  - resource_id: planning_area
    type: resources.PlanningAreaResource
  - resource_id: uss_identification
    type: resources.interuss.uss_identification.USSIdentificationResource?
  - resource_id: concurrency_behavior_adjustment
    type: resources.interuss.scenarios.astm.netrid.common.dss.heavy_traffic_concurrent.HeavyTrafficConcurrentBehaviorResource?
actions:
  - test_scenario:
      scenario_type: scenarios.versioning.GetSystemVersions
      resources:
        version_providers: test_env_version_providers
        system_identity: system_identity
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.ServiceProviderNotifiesSlowUpdates
      resources:
        flights_data: flights_data
        service_providers: service_providers
        evaluation_configuration: evaluation_configuration
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.DisplayProviderBehavior
      resources:
        observers: observers
        mock_uss: mock_uss_sp
        id_generator: id_generator
        dss_pool: dss_instances
        isa: service_area
        uss_identification: uss_identification?
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.NetworkedUASDisconnect
      resources:
        flights_data: flights_data
        service_providers: service_providers
        evaluation_configuration: evaluation_configuration
        dss_pool: dss_instances
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.SpOperatorNotifyMissingFields
      resources:
        flights_data: flights_data
        service_providers: service_providers
        evaluation_configuration: evaluation_configuration
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.ServiceProviderNotificationBehavior
      resources:
        flights_data: flights_data
        service_providers: service_providers
        mock_uss: mock_uss_dp
        id_generator: id_generator
        dss_pool: dss_instances
        uss_identification: uss_identification
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.NominalBehavior
      resources:
        flights_data: flights_data
        service_providers: service_providers
        observers: observers?
        evaluation_configuration: evaluation_configuration
        dss_pool: dss_instances?
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.Misbehavior
      resources:
        flights_data: flights_data
        service_providers: service_providers
        evaluation_configuration: evaluation_configuration
        dss_pool: dss_instances
  - action_generator:
      generator_type: action_generators.astm.f3411.ForEachDSS
      resources:
        dss_instances: dss_instances
        dss_datastore_cluster: dss_datastore_cluster?
        utm_client_identity: utm_client_identity
        id_generator: id_generator
        service_area: service_area
        problematically_big_area: problematically_big_area
        planning_area: planning_area
        concurrency_behavior_adjustment: concurrency_behavior_adjustment?
      specification:
        action_to_repeat:
          test_suite:
            suite_type: suites.astm.netrid.f3411_22a.dss_probing
            resources:
              dss: dss
              all_dss_instances: dss_instances
              dss_datastore_cluster: dss_datastore_cluster?
              utm_client_identity: utm_client_identity
              id_generator: id_generator
              isa: service_area
              client_identity: utm_client_identity
              problematically_big_area: problematically_big_area
              planning_area: planning_area
              concurrency_behavior_adjustment: concurrency_behavior_adjustment?
        dss_instances_source: dss_instances
        dss_instance_id: dss
  - test_scenario:
      scenario_type: scenarios.astm.netrid.v22a.AggregateChecks
      resources:
        service_providers: service_providers
        observers: observers?
        dss_instances: dss_instances
