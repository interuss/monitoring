name: ASTM F3548-21
resources:
  test_env_version_providers: resources.versioning.VersionProvidersResource?
  prod_env_version_providers: resources.versioning.VersionProvidersResource?
  flight_planners: resources.flight_planning.FlightPlannersResource
  flight_planners_to_clear: resources.flight_planning.FlightPlannersResource
  dss: resources.astm.f3548.v21.DSSInstanceResource
  dss_instances: resources.astm.f3548.v21.DSSInstancesResource?
  interuss_dss_instances: resources.astm.f3548.v21.DSSInstancesResource?
  dss_datastore_cluster: resources.interuss.datastore.DatastoreDBClusterResource?

  conflicting_flights_provider: resources.resource.ResourceProvidingResource[resources.flight_planning.FlightIntentsResource]
  priority_preemption_flights_provider: resources.resource.ResourceProvidingResource[resources.flight_planning.FlightIntentsResource]?
  non_conflicting_flights_provider: resources.resource.ResourceProvidingResource[resources.flight_planning.FlightIntentsResource]
  invalid_flights_provider: resources.resource.ResourceProvidingResource[resources.flight_planning.FlightIntentsResource]

  nominal_planning_selector: resources.flight_planning.FlightPlannerCombinationSelectorResource?
  priority_planning_selector: resources.flight_planning.FlightPlannerCombinationSelectorResource?
  utm_auth: resources.communications.AuthAdapterResource?
  second_utm_auth: resources.communications.AuthAdapterResource?
  utm_client_identity: resources.communications.ClientIdentityResource
  mock_uss: resources.interuss.mock_uss.client.MockUSSResource?

  # Zero or one of the following two resources must be provided
  id_generator: resources.interuss.id_generator.IDGeneratorResource?
  id_generator_provider: resources.interuss.id_generator.IDGeneratorProviderResource?

  planning_area_provider: resources.resource.ResourceProvidingResource[resources.planning_area.PlanningAreaResource]
  problematically_big_area: resources.VolumeResource
  system_identity: resources.versioning.SystemIdentityResource?
local_resources:
  id_generator:
    resource_type: resources.interuss.id_generator.IDGeneratorResource
    dependencies:
      client_identity: utm_client_identity
    specification: {}
  id_generator_provider:
    resource_type: resources.interuss.id_generator.IDGeneratorProviderResource
    dependencies:
      base_resource: id_generator
    specification: {}
  system_identity:
    resource_type: resources.versioning.SystemIdentityResource
    specification:
      system_identity: astm.f3548.v21
  dss_environments:
    resource_type: resources.combinations.ResourceCombinationsResource
    dependencies:
      dss: dss_instances?
    specification: {}
  dss_probing_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: dss_environments
      planning_area: planning_area_provider
      id_generator: id_generator_provider
      flight_intents: non_conflicting_flights_provider
    specification: {}
  priority_preemption_combinations:
    resource_type: resources.combinations.ResourceCombinationsResource
    dependencies:
      uss1: flight_planners
      uss2: flight_planners
      combination_selector: priority_planning_selector?
    specification: {}
  priority_preemption_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: priority_preemption_combinations  # provides uss1, uss2
      flight_intents: priority_preemption_flights_provider
    specification: {}
  equal_priority_conflict_combinations:
    resource_type: resources.combinations.ResourceCombinationsResource
    dependencies:
      uss1: flight_planners
      uss2: flight_planners
      combination_selector: nominal_planning_selector?
    specification: {}
  equal_priority_conflict_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: equal_priority_conflict_combinations  # provides uss1, uss2
      flight_intents: conflicting_flights_provider
    specification: {}
  single_planner_planner_environments:
    resource_type: resources.combinations.ResourceCombinationsResource
    dependencies:
      tested_uss: flight_planners
    specification: {}
  invalid_intents_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: single_planner_planner_environments
      flight_intents: invalid_flights_provider
    specification: {}
  conflicting_flights_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: single_planner_planner_environments
      flight_intents: conflicting_flights_provider
    specification: {}
  non_conflicting_flights_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: single_planner_planner_environments
      flight_intents: non_conflicting_flights_provider
    specification: {}
  single_planner_environments:
    resource_type: resources.environments.EnvironmentAugmentationResource
    dependencies:
      environments: single_planner_planner_environments
      invalid_flight_intents: invalid_flights_provider
      conflicting_flights: conflicting_flights_provider
      non_conflicting_flights: non_conflicting_flights_provider
  flight_intents_environments:
    resource_type: resources.environments.ConcatenatedResourceEnvironmentsResource
    dependencies:
      dss_probing: dss_probing_environments
      priority_preemption: priority_preemption_environments?
      equal_priority_conflict: equal_priority_conflict_environments
      invalid: invalid_intents_environments
      conflicting: conflicting_flights_environments
      non_conflicting: non_conflicting_flights_environments
    specification: {}
actions:
- test_scenario:
    scenario_type: scenarios.versioning.GetSystemVersions
    resources:
      version_providers: test_env_version_providers
      system_identity: system_identity
- test_scenario:
    scenario_type: scenarios.astm.utm.dss.pool_info.PoolInfo
    resources:
      dss_instances: interuss_dss_instances
- test_scenario:
    scenario_type: scenarios.astm.utm.PrepareFlightPlanners
    resources:
      flight_planners: flight_planners_to_clear
      mock_uss: mock_uss?
      dss: dss
      flight_intents_environments: flight_intents_environments?
- action_generator:
    generator_type: action_generators.resource_environments.ResourceEnvironmentsActionGenerator
    resources:
      dss_probing_environments: dss_probing_environments
      dss_instances: dss_instances
      dss_datastore_cluster: dss_datastore_cluster?
      second_utm_auth: second_utm_auth?
      utm_client_identity: utm_client_identity
      problematically_big_area: problematically_big_area
    specification:
      resource_environments_source: dss_probing_environments
      action_to_repeat:
        test_suite:
          suite_type: suites.astm.utm.dss_probing
          resources:
            dss: dss
            second_utm_auth: second_utm_auth?
            utm_client_identity: utm_client_identity
            all_dss_instances: dss_instances
            dss_datastore_cluster: dss_datastore_cluster?
            flight_intents: flight_intents
            id_generator: id_generator
            planning_area: planning_area
            problematically_big_area: problematically_big_area
- action_generator:
    generator_type: action_generators.resource_environments.ResourceEnvironmentsActionGenerator
    resources:
      priority_preemption_environments: priority_preemption_environments
      dss: dss
    specification:
      resource_environments_source: priority_preemption_environments
      action_to_repeat:
        test_scenario:
          scenario_type: scenarios.astm.utm.ConflictHigherPriority
          resources:
            flight_intents: flight_intents
            tested_uss: uss1
            control_uss: uss2
            dss: dss
- action_generator:
    generator_type: action_generators.resource_environments.ResourceEnvironmentsActionGenerator
    resources:
      equal_priority_conflict_environments: equal_priority_conflict_environments
      dss: dss
    specification:
      resource_environments_source: equal_priority_conflict_environments
      action_to_repeat:
        test_scenario:
          scenario_type: scenarios.astm.utm.ConflictEqualPriorityNotPermitted
          resources:
            flight_intents: flight_intents
            tested_uss: uss1
            control_uss: uss2
            dss: dss
- action_generator:
    generator_type: action_generators.resource_environments.ResourceEnvironmentsActionGenerator
    resources:
      single_planner_environments: single_planner_environments
      dss: dss
      mock_uss: mock_uss?
      utm_auth: utm_auth?
    specification:
      resource_environments_source: single_planner_environments
      action_to_repeat:
        test_suite:
          suite_type: suites.astm.utm.single_planner
          resources:
            tested_uss: tested_uss
            invalid_flight_intents: invalid_flight_intents
            non_conflicting_flights: non_conflicting_flights
            conflicting_flights: conflicting_flights
            dss: dss
            mock_uss: mock_uss?
            utm_auth: utm_auth?
- test_scenario:
    scenario_type: scenarios.astm.utm.PrepareFlightPlanners  # TODO: Convert this to a scenario which only clears the area (does not check readiness)
    resources:
      flight_planners: flight_planners
      mock_uss: mock_uss?
      dss: dss
      flight_intents_environments: flight_intents_environments?
- test_scenario:
    scenario_type: scenarios.astm.utm.make_uss_report.MakeUssReport
    resources:
      utm_auth: utm_auth
- test_scenario:
    scenario_type: scenarios.astm.utm.versioning.evaluate_system_versions.EvaluateSystemVersions
    resources:
      test_env_version_providers: test_env_version_providers
      prod_env_version_providers: prod_env_version_providers
      system_identity: system_identity
- test_scenario:
    scenario_type: scenarios.astm.utm.AggregateChecks
    resources:
      flight_planners: flight_planners

participant_verifiable_capabilities:
  - id: scd
    name: Strategic Conflict Detection
    description: Participant fulfills testable requirements necessary to perform the Strategic Conflict Detection role.
    verification_condition:
      requirements_checked:
          checked:
              requirement_sets:
                  - "astm.f3548.v21.scd#Automated verification"
  - id: no_failures
    name: Fails No Existing Tests
    description: Until testing coverage is sufficiently complete to verify all intended requirements for particular roles, this capability may be useful in communicating that the participant has passed all existing applicable tests for their role and capabilities.  This capability should be removed once test coverage extends to all intended requirements.
    verification_condition:
        no_failed_checks: {}
