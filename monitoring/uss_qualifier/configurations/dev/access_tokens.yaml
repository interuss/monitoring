$content_schema: monitoring/uss_qualifier/configurations/configuration/USSQualifierConfiguration.json
v1:
  test_run:
    resources:
      resource_declarations:
        utm_auth: {$ref: 'library/environment.yaml#/utm_auth'}
        access_token_expectations:
          resource_type: resources.communications.AccessTokensExpectationsResource
          specification:
            expectations:
              - request:
                  intended_audience: test_audience.example.com
                  scopes:
                    - rid.inject_test_data
                expectations:
                  has_header_values:
                    - claim: typ
                      equals_string_value: JWT
                    - claim: alg
                      equals_string_value: RS256
                  validates_against_public_key: |
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtjrMt+vOxuqjOU+hwrVA
                    gHjBMs9nMw1ONSpiLOpUQSnqvBwB0Zba+8e2tGJeQDWEf8KoVt3PfMa34EomLhWZ
                    GWEosftV8gZSbneDjUnE+kUTXvZmMFa2Byc9njsl5N7dOC1pT7qHNJOB9RhK/9eh
                    Pl7XczRuIJR7N/ZFk+XZSlFh5werq7ME7GdhBPFaO30KZRmRhgwVtAP2kA8sSrqg
                    xXuuyy808UvT3MkzL63Sv/EzQSs8YLVAn/BwiQlmWxKFmtzNk9RJdYkxRJN1E9E2
                    sS2i6b55j94hiPwwQ16GsAAWUT+ijezlHuGZU+OLYtYfoHy+4Ku31doQc0ujvtYO
                    JQIDAQAB
                    -----END PUBLIC KEY-----
                  has_claim_values:
                    - claim: exp
                      beyond_request_time_offset: 50m
                      within_request_time_offset: 1h10m
                    - claim: iss
                      equals_string_value: dummy
                    - claim: sub
                      equals_string_value: uss_qualifier
        auth_adapter_expectations:
          resource_type: resources.communications.AuthAdapterExpectationsResource
          specification:
            expectations:
              # See monitoring/monitorlib/auth.py for the set of concrete AuthAdapter types.
              - adapter_type: DummyOAuth
                attribute_values:
                  # Attributes are for the concrete AuthAdapter instance available to the GetAccessTokens scenario.
                  # See monitoring/monitorlib/auth.py for the definitions of concrete auth adapters and their attributes.
                  - name: _oauth_token_endpoint
                    equals_string_value: http://oauth.authority.localutm:8085/token

    action:
      test_suite:
        suite_definition:
          name: Access tokens validation test suite
          resources:
            auth_adapter: resources.communications.AuthAdapterResource
            token_expectations: resources.communications.AccessTokensExpectationsResource?
            adapter_expectations: resources.communications.AuthAdapterExpectationsResource?
          actions:
            - test_scenario:
                scenario_type: scenarios.interuss.communications.GetAccessTokens
                resources:
                  auth_adapter: auth_adapter
                  token_expectations: token_expectations
                  adapter_expectations: adapter_expectations
                on_failure: Continue
        resources:
          auth_adapter: utm_auth
          token_expectations: access_token_expectations
          adapter_expectations: auth_adapter_expectations

    execution:
      stop_fast: false

  artifacts:
    sequence_view: {}

  validation:
    $ref: ./library/validation.yaml#/normal_test
