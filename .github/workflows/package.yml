name: Python package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Build source distribution and wheel
        run: uv build
      - name: Test installed wheel without source imports
        run: |
          uv venv "$RUNNER_TEMP/package-test"
          uv pip install --python "$RUNNER_TEMP/package-test/bin/python" dist/*.whl
          "$RUNNER_TEMP/package-test/bin/python" -I test/packaging_test.py
